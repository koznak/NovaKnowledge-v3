name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NovaKnowledge.sln

      - name: Build
        run: dotnet build NovaKnowledge.sln --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test tests/NovaKnowledge.UnitTests/NovaKnowledge.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Evaluation Service Tests
        run: |
          pip install -r python/evaluation-service/requirements.txt
          python -c "from python.evaluation-service.main import compute_rag_metrics; print(compute_rag_metrics([{'context':'pto 20 days','expected_answer':'20 days','question':'pto'}]))" || \
          python -c "import sys; sys.path.insert(0,'python/evaluation-service'); from main import compute_rag_metrics; assert compute_rag_metrics([{'context':'pto 20 days','expected_answer':'20 days','question':'pto'}])['faithfulness'] > 0"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: docker/Dockerfile.gateway
          - service: chat-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Chat/NovaKnowledge.Chat.Api/NovaKnowledge.Chat.Api.csproj
            assembly_dll: NovaKnowledge.Chat.Api.dll
          - service: orchestration-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Orchestration/NovaKnowledge.Orchestration.Api/NovaKnowledge.Orchestration.Api.csproj
            assembly_dll: NovaKnowledge.Orchestration.Api.dll
          - service: ingestion-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Ingestion/NovaKnowledge.Ingestion.Api/NovaKnowledge.Ingestion.Api.csproj
            assembly_dll: NovaKnowledge.Ingestion.Api.dll
          - service: search-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Search/NovaKnowledge.Search.Api/NovaKnowledge.Search.Api.csproj
            assembly_dll: NovaKnowledge.Search.Api.dll
          - service: feedback-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Feedback/NovaKnowledge.Feedback.Api/NovaKnowledge.Feedback.Api.csproj
            assembly_dll: NovaKnowledge.Feedback.Api.dll
          - service: admin-api
            dockerfile: docker/Dockerfile.service
            project_path: src/Services/Admin/NovaKnowledge.Admin.Api/NovaKnowledge.Admin.Api.csproj
            assembly_dll: NovaKnowledge.Admin.Api.dll
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ "${{ matrix.service }}" = "gateway" ]; then
            docker build -f ${{ matrix.dockerfile }} -t novaknowledge/${{ matrix.service }}:latest .
          else
            docker build -f ${{ matrix.dockerfile }} \
              --build-arg PROJECT_PATH=${{ matrix.project_path }} \
              --build-arg ASSEMBLY_DLL=${{ matrix.assembly_dll }} \
              -t novaknowledge/${{ matrix.service }}:latest .
          fi

  deploy-dev:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep (dev)
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file infra/bicep/main.bicep \
            --parameters infra/parameters/dev.bicepparam
