name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NovaKnowledge.sln

      - name: Build
        run: dotnet build NovaKnowledge.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format NovaKnowledge.sln --verify-no-changes --no-restore

      - name: Unit Tests
        run: dotnet test tests/NovaKnowledge.UnitTests/NovaKnowledge.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install evaluation service dependencies
        run: pip install -r python/evaluation-service/requirements.txt

      - name: Python Evaluation Service Tests
        run: pytest python/evaluation-service -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

