name: Bug report
description: Report a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For security issues, do **not** use this
        template — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, including the service/port and request payload if relevant.
      placeholder: |
        1. Start Search.Api
        2. POST /api/search/query with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: The commit SHA or tag you tested.
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Retrieval mode
      options:
        - Hybrid (EnableHybridSearch: true)
        - Keyword-only (EnableHybridSearch: false)
        - Not applicable
    validations:
      required: false
